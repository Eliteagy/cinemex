<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>Cinemex</title>
    <style>
      /* Opening: only the logo, straight on the desktop (transparent window, no card, no black; logo-splash.png
         is logo.png with its black disc turned transparent).
         It comes in small, grows big, and opens out into the editor. Timing matches SPLASH_MS. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
      body { display: grid; place-items: center; }
      .logo {
        width: 420px; height: 420px;
        opacity: 0;
        transform: scale(0.12);
        filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.35)) drop-shadow(0 0 0 rgba(212, 175, 55, 0));
        will-change: transform, opacity, filter;
        animation:
          grow 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards,
          glow 1.2s ease-out 0.9s forwards,
          open 0.5s cubic-bezier(0.4, 0, 1, 1) 2.45s forwards;
      }
      /* small → big (a touch past full size, then settles) */
      @keyframes grow {
        0% { opacity: 0; transform: scale(0.12); }
        25% { opacity: 1; }
        78% { transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes glow { to { filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.35)) drop-shadow(0 0 26px rgba(212, 175, 55, 0.5)); } }
      /* opens out: keeps growing and fades as the editor appears */
      @keyframes open { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
      @media (prefers-reduced-motion: reduce) {
        .logo { transform: none; animation: fade-in 300ms forwards, fade-out 300ms ease-in 2.6s forwards; }
        @keyframes fade-in { to { opacity: 1; } }
        @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="logo-splash.png" alt="Cinemex" />
  </body>
</html>
