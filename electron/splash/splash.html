<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>Cinemex</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
      body { display: grid; place-items: center; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; }
      .card { position: relative; width: 520px; height: 380px; border-radius: 20px; background: radial-gradient(120% 90% at 50% 38%, #15151a 0%, #0a0a0c 62%, #060607 100%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -60px 90px -50px rgba(212, 175, 55, 0.14), 0 12px 18px -8px rgba(0, 0, 0, 0.85); display: grid; place-items: center; overflow: hidden; animation: out 420ms ease-in 2.55s forwards; }
      .glow { position: absolute; top: 61px; left: 50%; width: 240px; height: 240px; margin-left: -120px; border-radius: 50%; background: radial-gradient(circle, rgba(200, 220, 255, 0.35), rgba(255, 220, 160, 0.08) 45%, transparent 70%); filter: blur(18px); opacity: 0; animation: flare 1.4s ease-out 0.25s forwards; }
      .logo { position: absolute; top: 55px; left: 50%; width: 250px; height: 250px; margin-left: -125px; opacity: 0; transform: scale(0.35) rotate(-40deg); filter: brightness(2.2) blur(6px); animation: burst 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards, spin 14s linear 1.35s infinite; }
      .bar { position: absolute; bottom: 34px; left: 50%; width: 140px; height: 2px; margin-left: -70px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; opacity: 0; animation: rise 400ms ease-out 1.2s forwards; }
      .bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #d4af37, transparent); animation: load 1.1s ease-in-out 1.2s infinite; }
      @keyframes burst { 60% { opacity: 1; filter: brightness(1.5) blur(0); } to { opacity: 1; transform: scale(1) rotate(0deg); filter: brightness(1) blur(0); } }
      @keyframes spin { from { transform: scale(1) rotate(0deg); } to { transform: scale(1) rotate(360deg); } }
      @keyframes flare { 35% { opacity: 1; } to { opacity: 0.45; } }
      @keyframes rise { to { opacity: 1; transform: none; } }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes out { to { opacity: 0; transform: scale(0.97); } }
      @media (prefers-reduced-motion: reduce) { .logo { animation: rise 300ms forwards; transform: none; filter: none; } .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <img class="logo" src="logo.png" alt="Cinemex" />
      <div class="bar"></div>
    </div>
  </body>
</html>
